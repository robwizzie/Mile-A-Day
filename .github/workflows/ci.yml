# Merge safety net. There is no other automated gate: main auto-deploys to the
# live API via Coolify, so this is what stands between a merge and production.
#
# backend job = the exact failure ladder of the v1.2 feed outage:
#   1. tsc build
#   2. drizzle-kit check (journal/snapshot consistency — catches the silent
#      migration-journal corruption a branch merge can cause)
#   3. the REAL migrator (dist/db/migrateCli.js) against a throwaway Postgres,
#      run twice: fresh apply, then again to prove idempotence (prod re-runs
#      it on every container boot)
#   4. seeded feed/story/hype/signing smoke test against the migrated schema
#
# iOS is NOT built here — Xcode Cloud owns that (see docs/XCODE_CLOUD_SETUP.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build + migrations + smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mad_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mad_ci
      APP_JWT_SECRET: ci-only-jwt-secret
      MEDIA_SIGNING_SECRET: ci-only-media-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Build (tsc)
        run: npm run build
      - name: Drizzle journal/snapshot check
        run: npx drizzle-kit check
      - name: Enable pg_trgm (migration 0000 uses gin_trgm_ops)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d mad_ci -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
      - name: Apply migrations to fresh database
        run: node dist/db/migrateCli.js
      - name: Re-run migrator (must be idempotent — prod runs it every boot)
        run: node dist/db/migrateCli.js
      - name: Seeded feed/story/hype/signing smoke test
        run: node scripts/ci-smoke.mjs
      # Buddy Walks shipped fully built and then sat dead in production because
      # a rollout flag defaulted off and every endpoint answered 404 in silence.
      # These assertions pin the flag's direction, the enrollment that rides
      # device registration, the opt-out (including the no-settings-row default)
      # and the host-only lobby PATCH.
      - name: Buddy gate + lobby-edit check
        run: node scripts/buddy-gate-check.mjs

  website:
    name: Website (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      # No lint step: the repo has no eslint dependency/config — the `lint`
      # script assumed a global install. `next build` type-checks, which is
      # the gate that matters here.
      - run: npm run build

  ios-typecheck:
    name: iOS (type-check)
    # Only when the app actually changes — macOS minutes bill at 10x Linux.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: macos-latest
    # NON-BLOCKING FOR NOW. This job has never run before it was written, and a
    # whole-target `swiftc -typecheck` can fail for reasons unrelated to any
    # diff (SDK drift, a file that only compiles with Xcode's build settings).
    # Turning it red on day one would block every merge. Read the log, confirm
    # it goes green on a known-good commit, THEN delete this line so it gates.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed for the diff below. The default shallow clone has no
          # origin/main, so `origin/main...HEAD` failed with "bad revision" and
          # the step was silently useless.
          fetch-depth: 0
      - name: Check for iOS changes
        id: changed
        run: |
          BASE="origin/${{ github.base_ref || 'main' }}"
          if git diff --name-only "$BASE"...HEAD -- 'app/**' | grep -q .; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi
      # There is no iOS test target worth running and no scheme build here —
      # this is purely "does the Swift still compile". That is exactly the class
      # of failure that has been reaching main: a non-exhaustive switch, a stale
      # call site, a Codable struct missing a CodingKey. All of them are type
      # errors, none of them need a simulator.
      #
      # The whole main-app source set goes in ONE invocation because Swift
      # resolves types across files within a module; checking files singly would
      # report every cross-file reference as undefined. The Watch app and the
      # widget extension are SEPARATE targets and are excluded.
      - name: Type-check the main app target
        # Skipped when nothing under app/ changed — this runner bills at 10x.
        if: steps.changed.outputs.ios == 'true'
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          find "app/Mile A Day" -name '*.swift' -print0 > /tmp/swift-files
          COUNT=$(tr -dc '\0' < /tmp/swift-files | wc -c)
          echo "Type-checking $COUNT Swift files against $SDK"
          xargs -0 xcrun swiftc -typecheck \
            -sdk "$SDK" \
            -target arm64-apple-ios17.0 \
            -swift-version 5 \
            < /tmp/swift-files
