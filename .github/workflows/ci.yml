# Merge safety net. There is no other automated gate: main auto-deploys to the
# live API via Coolify, so this is what stands between a merge and production.
#
# backend job = the exact failure ladder of the v1.2 feed outage:
#   1. tsc build
#   2. drizzle-kit check (journal/snapshot consistency — catches the silent
#      migration-journal corruption a branch merge can cause)
#   3. the REAL migrator (dist/db/migrateCli.js) against a throwaway Postgres,
#      run twice: fresh apply, then again to prove idempotence (prod re-runs
#      it on every container boot)
#   4. seeded feed/story/hype/signing smoke test against the migrated schema
#
# iOS is NOT built here — Xcode Cloud owns that (see docs/XCODE_CLOUD_SETUP.md).
# Swift is type-checked by the separate ios.yml workflow: macOS runners queue,
# and a stalled one must not be able to cancel the Linux jobs below.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build + migrations + smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mad_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mad_ci
      APP_JWT_SECRET: ci-only-jwt-secret
      MEDIA_SIGNING_SECRET: ci-only-media-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Build (tsc)
        run: npm run build
      - name: Drizzle journal/snapshot check
        run: npx drizzle-kit check
      - name: Enable pg_trgm (migration 0000 uses gin_trgm_ops)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d mad_ci -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
      - name: Apply migrations to fresh database
        run: node dist/db/migrateCli.js
      - name: Re-run migrator (must be idempotent — prod runs it every boot)
        run: node dist/db/migrateCli.js
      - name: Seeded feed/story/hype/signing smoke test
        run: node scripts/ci-smoke.mjs
      # Buddy Walks shipped fully built and then sat dead in production because
      # a rollout flag defaulted off and every endpoint answered 404 in silence.
      # These assertions pin the flag's direction, the enrollment that rides
      # device registration, the opt-out (including the no-settings-row default)
      # and the host-only lobby PATCH.
      - name: Buddy gate + lobby-edit check
        run: node scripts/buddy-gate-check.mjs
      # Cross-app duplicate detection. An app that records a FRAGMENT of a walk
      # another app already recorded fails every distance-agreement test while
      # being unambiguously the same walk — which is how a 1.84 mi walk counted
      # as 2.55 in production.
      - name: Cross-app duplicate containment check
        run: node scripts/dedupe-containment-check.mjs
      # A buddy walk is ONE post with everyone on it. Every way that can break
      # breaks silently: a second card for the same walk, a crew photo that
      # never reaches the payload, or — the one nobody would notice — a
      # participant's GPS trace published after they turned route sharing off.
      - name: Buddy group post check
        run: node scripts/buddy-group-post-check.mjs
      # The buddy history archive. Everything that can go wrong with a
      # per-viewer archive goes wrong silently — a walk missing from the list,
      # an un-friended name still rendering, a photo reachable here that the
      # feed would refuse, a cursor that repeats a row on page 2.
      - name: Buddy history visibility + paging check
        run: node scripts/buddy-history-check.mjs
      # Live membership. A late joiner landing in the wrong participant status
      # is invisible on every roster, worth nothing toward a co-op goal, and
      # has every progress report rejected — with nothing thrown anywhere. The
      # same file pins cancel's two windows (a cancel reaching a live walk
      # would wipe other people's miles) and the per-viewer history hide.
      - name: Buddy live join/leave/cancel/hide check
        run: node scripts/buddy-live-check.mjs
      # Two prod-only push failures, neither reproducible without a shell there.
      # APNS_KEY is pasted into a dashboard in four different shapes and one of
      # them silently produced an unsignable PEM; device-token pruning is the
      # one push path that DESTROYS state, so a server-side fault (bad key,
      # wrong topic) must never read as a dead token and wipe registrations.
      - name: APNs key + token-pruning check
        run: node scripts/push-config-check.mjs

  website:
    name: Website (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      # No lint step: the repo has no eslint dependency/config — the `lint`
      # script assumed a global install. `next build` type-checks, which is
      # the gate that matters here.
      - run: npm run build
